<!-- tela de controle de estoque -->

{% extends 'base.html' %}
{% block content %}
    <div class="eyebrow">Entradas e saídas</div>
    <h1>Controle de estoque</h1>
    <p>Registre entradas e saídas vinculadas a uma ordem de produção, cliente e processo.</p>

    <div class="abas">
        <a class="{% if tipo == 'Entrada' %}aba-ativa{% endif %}" href="?tipo=Entrada">Entrada</a>
        <a class="{% if tipo == 'Saída' %}aba-ativa{% endif %}" href="?tipo=Saída">Saída</a>
    </div>

    {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}

    <form method="post">
        <input type="hidden" name="tipo" value="{{ tipo }}">

        <label for="produto">Produto</label>
        <select id="produto" name="produto" required>
            <option value="">Selecione</option>
            {% for p in produtos %}
            <option value="{{ p.referencia }}">{{ p.referencia }} - {{ p.descricao }}</option>
            {% endfor %}
        </select>

        <label for="quantidade">Quantidade</label>
        <input type="number" id="quantidade" name="quantidade" min="1" placeholder="Digite a quantidade" required>

        <label for="data">Data</label>
        <input type="text" id="data" name="data" placeholder="dd/mm/aaaa" required>

        <label for="origem">Origem</label>
        <select id="origem" name="origem" required>
            <option value="">Selecione</option>
            <option value="Entrada">Entrada</option>
            <option value="Saída">Saída</option>
        </select>

        <label for="ordem_producao">Ordem de produção</label>
        <input type="text" id="ordem_producao" name="ordem_producao"
               placeholder="Digite o código da ordem de produção" required>

        <label for="cliente">Cliente</label>
        <select id="cliente" name="cliente" required>
            <option value="">Selecione</option>
            {% for c in clientes %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>

        <label for="local">Local / Processo</label>
        <select id="local" name="local" required>
            <option value="">Selecione</option>
            {% for l in locais %}
            <option value="{{ l }}">{{ l }}</option>
            {% endfor %}
        </select>

        <label for="observacao">Observação (opcional)</label>
        <textarea id="observacao" name="observacao" placeholder="Digite uma observação..."></textarea>

        <button type="submit" class="botao">Registrar {{ tipo }}</button>
    </form>

    <a class="voltar" href="{{ url_for('historico.historico') }}">Ver Histórico de Movimentações</a>
{% endblock %}
