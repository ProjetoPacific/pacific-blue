{% extends 'base.html' %}{% block content %}
<a class="voltar" href="{{ url_for('produtos.produtos_lista') }}">← Voltar</a><h1>{% if produto %}Editar produto{% else %}Cadastrar produto{% endif %}</h1>
{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
<form method="post" class="form-produto"><div class="coluna">
<label>Referência</label><input name="referencia" value="{{ produto.referencia if produto else '' }}" required>
<label>Descrição</label><input name="descricao" value="{{ produto.descricao if produto else '' }}" required>
<label>Cor</label><input name="cor" value="{{ produto.cor if produto else '' }}">
<label>Tamanho</label><input name="tamanho" value="{{ produto.tamanho if produto else '' }}">
<label>Gênero</label><select name="genero">{% for g in generos %}<option {% if produto and produto.genero == g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select>
<label>Grupo</label><select name="grupo">{% for g in grupos %}<option {% if produto and produto.grupo == g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></div><div class="coluna">
<label>Grade</label><input name="grade" value="{{ produto.grade if produto else '' }}"><label>Data</label><input name="data" value="{{ produto.data if produto else '' }}" placeholder="dd/mm/aaaa">
<label>Cliente</label><select name="cliente">{% for c in clientes %}<option {% if produto and produto.cliente == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select>
<label>Fornecedor</label><select name="fornecedor">{% for f in fornecedores %}<option {% if produto and produto.fornecedor == f %}selected{% endif %}>{{ f }}</option>{% endfor %}</select>
<label>Quantidade de peças em estoque</label><input type="number" name="estoque" min="0" value="{{ produto.estoque if produto else 0 }}" required></div>
<div class="botoes"><a class="botao cancelar" href="{{ url_for('produtos.produtos_lista') }}">Cancelar</a><button type="submit" class="botao">Salvar</button></div></form>{% endblock %}
