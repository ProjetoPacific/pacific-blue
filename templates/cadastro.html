<!-- tela para criar uma conta -->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Pacific Blue</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body class="pagina-login">
    <div class="login-box">
        <h1>PACIFIC BLUE</h1>
        <p>Criação de conta</p>

        <div class="login-card">
            <h2>Novo cadastro</h2>

            {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
            {% if sucesso %}<p class="sucesso">{{ sucesso }}</p>{% endif %}

            <form method="post">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" placeholder="Crie um usuário" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

                <label for="confirmar">Confirmar senha</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="Digite a senha novamente" required>

                <button type="submit">CADASTRAR</button>
            </form>

            <div class="links-login">
                <a href="{{ url_for('login.login') }}">Voltar para o login</a>
            </div>
        </div>
    </div>
</body>
</html>
