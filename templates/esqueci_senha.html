<!-- tela para recuperar senha -->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha - Pacific Blue</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body class="pagina-login">
    <div class="login-box">
        <h1>PACIFIC BLUE</h1>
        <p>Recuperação de senha</p>

        <div class="login-card">
            <h2>Esqueci minha senha</h2>

            {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
            {% if sucesso %}<p class="sucesso">{{ sucesso }}</p>{% endif %}

            <form method="post">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required>

                <label for="email">E-mail cadastrado</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                <label for="nova_senha">Nova senha</label>
                <input type="password" id="nova_senha" name="nova_senha" placeholder="Digite a nova senha" required>

                <label for="confirmar">Confirmar nova senha</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="Digite novamente" required>

                <button type="submit">ALTERAR SENHA</button>
            </form>

            <div class="links-login">
                <a href="{{ url_for('login.login') }}">Voltar para o login</a>
            </div>
        </div>
    </div>
</body>
</html>
