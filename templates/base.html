<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102b46">
    <title>{% block title %}Pacific Blue | Gestão Industrial{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>PACIFIC BLUE</h2>
            <nav aria-label="Navegação principal">
                <a class="{% if request.path == url_for('dashboard.dashboard') %}ativo{% endif %}" href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
                <a class="{% if request.path.startswith('/produtos') %}ativo{% endif %}" href="{{ url_for('produtos.produtos_lista') }}">Produtos e estoque</a>
                <a class="{% if request.path.startswith('/movimentacao') %}ativo{% endif %}" href="{{ url_for('movimentacao.movimentacao') }}">Controle de estoque</a>
                <a class="{% if request.path.startswith('/entradas') %}ativo{% endif %}" href="{{ url_for('movimentacao.entradas') }}">Entradas</a>
                <a class="{% if request.path.startswith('/saidas') %}ativo{% endif %}" href="{{ url_for('movimentacao.saidas') }}">Saídas</a>
                <a class="{% if request.path.startswith('/historico') %}ativo{% endif %}" href="{{ url_for('historico.historico') }}">Histórico</a>
                <a class="{% if request.path.startswith('/clientes') %}ativo{% endif %}" href="{{ url_for('clientes.clientes_lista') }}">Clientes</a>
                <a class="{% if request.path.startswith('/lotes') %}ativo{% endif %}" href="{{ url_for('lotes.lotes_lista') }}">Lotes</a>
                <a class="{% if request.path.startswith('/usuarios') %}ativo{% endif %}" href="{{ url_for('usuarios.usuarios_lista') }}">Usuários</a>
                <a class="{% if request.path.startswith('/ordens') %}ativo{% endif %}" href="{{ url_for('ordens.ordens_lista') }}">Ordem de produção</a>
            </nav>
            <a class="sair" href="{{ url_for('login.alterar_senha') }}">Alterar senha</a>
            <a class="sair" href="{{ url_for('login.sair') }}">↪ Sair</a>
        </aside>
        <main class="conteudo">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
