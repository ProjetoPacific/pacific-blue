<!-- tela de usuarios -->

{% extends 'base.html' %}
{% block content %}
    <h1>Usuários</h1>
    <p>Usuários cadastrados no sistema.</p>

    <table>
        <tr><th>Usuário</th><th>Nome</th><th>E-mail</th></tr>
        {% for u in usuarios %}
        <tr><td>{{ u.usuario }}</td><td>{{ u.nome }}</td><td>{{ u.email }}</td></tr>
        {% endfor %}
    </table>
{% endblock %}
